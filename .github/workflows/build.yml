name: Compilar ConorNitroOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Instalar KIWI manualmente
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip xorriso
          sudo pip3 install kiwi-cli

      - name: Compilar la ISO
        run: |
          sudo kiwi-ng system build --description . --target-dir /tmp/conor-iso

      - name: Subir el resultado
        uses: actions/upload-artifact@v3
        with:
          name: ConorNitroOS-ISO
          path: /tmp/conor-iso/*.iso
