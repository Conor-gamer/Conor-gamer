name: Compilar ConorNitroOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Instalar dependencias necesarias
        run: |
          sudo apt-get update
          # Instalamos kiwi y herramientas básicas de empaquetado
          sudo apt-get install -y python3-kiwi python3-setuptools xorriso qemu-utils

      - name: Compilar la ISO
        run: |
          # Ejecutamos el comando de compilación
          # Asegurate de que tu archivo de configuración (config.kiwi) esté en la raíz
          sudo kiwi-ng system build --description . --target-dir /tmp/conor-iso

      - name: Subir el resultado
        uses: actions/upload-artifact@v3
        with:
          name: ConorNitroOS-ISO
          path: /tmp/conor-iso/*.iso
