name: Compilar ConorNitroOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: suse/kiwi:latest
      options: --privileged
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Compilar la ISO
        run: |
          kiwi-ng system build --description . --target-dir /tmp/conor-iso

      - name: Subir el resultado
        uses: actions/upload-artifact@v3
        with:
          name: ConorNitroOS-ISO
          path: /tmp/conor-iso/*.iso
